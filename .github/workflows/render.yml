name: Render carosello Neural Agora

on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:
    inputs:
      payload:
        description: "JSON di test (stessi campi che manda Make)"
        required: false
        default: '{"date":"27 agosto 2026","hook_headline":"I due articoli di oggi","ghost_title":"Titolo di prova AI","ghost_excerpt":"Estratto di prova.","ghost_image":"https://picsum.photos/1200/800","ghost_category":"AI","blogger_title":"Titolo di prova blog","blogger_excerpt":"Estratto di prova.","blogger_image":"https://picsum.photos/1200/801"}'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Installa ffmpeg (serve per cover.mp4)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Genera le 4 slide + il video di copertina
        env:
          PAYLOAD: ${{ github.event.client_payload && toJson(github.event.client_payload) || inputs.payload }}
        run: node render-daily.js

      - name: Pubblica le immagini aggiornate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/img
          git diff --staged --quiet || git commit -m "Aggiorna carosello del giorno [skip ci]"
          git push
